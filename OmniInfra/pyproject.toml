[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniInfra"
dynamic = ["version"]
description = "Infrastructure for biomedical AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic", "langchain", "python-dotenv"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "omniInfra.version.__version__"}

[tool.setuptools.packages.find]
exclude = ["test*", "tutorials*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "TID", "C4", "BLE", "UP", "RUF100", "TCH"]
ignore = ["E501", "E731", "E741", "B008", "E402", "PLR0913", "PLR0912", "PLR2004", "PLR0915", "PLC0415", "BLE001", "B005"]
